<nav [attr.aria-label]="'ux.breadcrumbs.label' | t">
  <ol class="flex min-w-0 flex-wrap items-center gap-x-1 gap-y-0.5 text-sm text-muted-foreground">
    @for (crumb of crumbs(); track $index; let last = $last) {
      <li class="flex min-w-0 items-center gap-1">
        @if (last) {
          <span
            aria-current="page"
            class="max-w-[16rem] truncate font-medium text-foreground"
            dir="auto"
            >{{ crumb.label }}</span
          >
        } @else if (crumb.link) {
          <a
            [routerLink]="crumb.link"
            class="max-w-[12rem] truncate rounded-sm underline-offset-4 hover:text-foreground hover:underline focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring"
            dir="auto"
            >{{ crumb.label }}</a
          >
        } @else {
          <span class="max-w-[12rem] truncate" dir="auto">{{ crumb.label }}</span>
        }
        @if (!last) {
          <app-icon [icon]="separator" svgClass="size-3.5 shrink-0 opacity-60 rtl:-scale-x-100" />
        }
      </li>
    }
  </ol>
</nav>
