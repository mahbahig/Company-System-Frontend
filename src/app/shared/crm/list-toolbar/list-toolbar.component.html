<form role="search" class="flex flex-col gap-3" novalidate (submit)="onSubmit($event)">
  <div class="flex flex-col gap-3 sm:flex-row sm:items-end">
    <div class="flex-1">
      <label appLabel for="list-search" class="mb-1.5 block">{{ 'crm.filters.search' | t }}</label>
      <div class="relative">
        <span class="pointer-events-none absolute start-3 top-1/2 -translate-y-1/2 text-muted-foreground">
          <app-icon [icon]="searchIcon" />
        </span>
        <input appInput id="list-search" type="search" class="ps-9" [formField]="searchForm.q" [placeholder]="searchPlaceholder()" />
      </div>
    </div>

    <div class="flex gap-2">
      <button type="submit" appButton>{{ 'common.actions.search' | t }}</button>
      @if (hasActiveFilter()) {
        <button type="button" appButton variant="outline" (click)="clear()">
          <app-icon [icon]="clearIcon" />
          {{ 'crm.filters.clear' | t }}
        </button>
      }
    </div>
  </div>

  @if (filters().length > 0 || toggles().length > 0) {
    <div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-4">
      @for (filter of filters(); track filter.name) {
        <div>
          <label appLabel [for]="'filter-' + filter.name" class="mb-1.5 block">{{ filter.label }}</label>
          <app-select>
            <select appSelect [id]="'filter-' + filter.name" [formField]="filterForm[filter.name]" (change)="apply()">
              <option value="">{{ 'crm.filters.any' | t }}</option>
              @for (option of filter.options; track option.value) {
                <option [value]="option.value">{{ option.label }}</option>
              }
            </select>
          </app-select>
        </div>
      }

      @if (toggles().length > 0) {
        <fieldset class="flex flex-wrap items-end gap-4 sm:col-span-2 lg:col-span-4">
          <legend class="sr-only">{{ 'crm.filters.quickFilters' | t }}</legend>
          @for (toggle of toggles(); track toggle.name) {
            <label class="flex cursor-pointer items-center gap-2 text-sm" [for]="'toggle-' + toggle.name">
              <input
                type="checkbox"
                [id]="'toggle-' + toggle.name"
                [formField]="toggleForm[toggle.name]"
                (change)="apply()"
                class="size-4 rounded border-input accent-primary focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring"
              />
              {{ toggle.label }}
            </label>
          }
        </fieldset>
      }
    </div>
  }
</form>
