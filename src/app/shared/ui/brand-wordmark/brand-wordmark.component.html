<svg
  [attr.viewBox]="viewBox()"
  class="block h-full w-auto overflow-visible"
  fill="currentColor"
  aria-hidden="true"
  focusable="false"
>
  @for (letter of layout().letters; track $index) {
    <path [attr.d]="letter.glyph.path" [attr.transform]="'translate(' + letter.x * em + ' 0)'" />
  }
</svg>
