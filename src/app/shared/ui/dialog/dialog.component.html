<dialog
  #dialog
  class="app-dialog m-auto w-[min(42rem,calc(100vw-2rem))] max-h-[calc(100dvh-2rem)] overflow-hidden rounded-lg border border-border bg-card p-0 text-card-foreground shadow-lg backdrop:bg-black/50 open:flex open:flex-col"
  [attr.aria-labelledby]="headingId"
  (close)="open.set(false)"
  (cancel)="requestClose($event)"
>
  <!-- The header (title + close) never scrolls away: only the body below scrolls, inside the dialog. -->
  <div class="flex shrink-0 items-start justify-between gap-4 border-b border-border p-5">
    <div>
      <h2 [id]="headingId" class="text-lg font-semibold">{{ heading() }}</h2>
      @if (description()) {
        <p class="mt-1 text-sm text-muted-foreground">{{ description() }}</p>
      }
    </div>
    <button
      type="button"
      class="rounded-md p-1 text-muted-foreground hover:bg-secondary focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring"
      [attr.aria-label]="'common.actions.close' | t"
      [appTooltip]="'common.actions.close' | t"
      (click)="requestClose()"
    >
      <svg
        aria-hidden="true"
        viewBox="0 0 20 20"
        class="size-5"
        fill="none"
        stroke="currentColor"
        stroke-width="1.6"
      >
        <path d="M5 5l10 10M15 5L5 15" stroke-linecap="round" />
      </svg>
    </button>
  </div>
  <div class="min-h-0 flex-1 overflow-y-auto overscroll-contain p-5">
    @if (open()) {
      <ng-content />
    }
  </div>
</dialog>
