@if (workflow.hasValue()) {
  <app-pipeline-tracker
    [view]="workflow.value()"
    [formActions]="['record_verification']"
    [busy]="busy()"
    [error]="error()"
    (act)="onAction($event)"
  />
}
@if (verifying()) {
  <form
    class="flex flex-col gap-3 rounded-md border border-border p-4"
    (submit)="submitVerification($event)"
  >
    <h3 class="text-sm font-semibold">{{ 'pipeline.actions.record_verification' | t }}</h3>
    <div class="grid gap-3 sm:grid-cols-2">
      <div>
        <label appLabel for="verification-state" required>{{
          'crm.customers.workflow.state' | t
        }}</label>
        <app-select class="mt-1.5">
          <select
            appSelect
            id="verification-state"
            [value]="state()"
            (change)="state.set($any($event.target).value)"
          >
            <option value="verified">{{ 'crm.customers.workflow.states.verified' | t }}</option>
            <option value="pending">{{ 'crm.customers.workflow.states.pending' | t }}</option>
          </select>
        </app-select>
      </div>
      @if (state() === 'verified') {
        <div>
          <label appLabel for="verification-method" required>{{
            'crm.customers.workflow.method' | t
          }}</label>
          <app-select class="mt-1.5">
            <select
              appSelect
              id="verification-method"
              [value]="method()"
              (change)="method.set($any($event.target).value)"
            >
              @for (option of methods; track option) {
                <option [value]="option">
                  {{ 'crm.customers.workflow.methods.' + option | t }}
                </option>
              }
            </select>
          </app-select>
        </div>
      } @else {
        <div>
          <label appLabel for="verification-reason" required>{{ 'pipeline.reason' | t }}</label>
          <input
            appInput
            id="verification-reason"
            class="mt-1.5"
            [value]="reason()"
            (input)="reason.set($any($event.target).value)"
          />
        </div>
      }
    </div>
    <label class="flex items-center gap-2 text-sm">
      <input
        type="checkbox"
        class="size-4 rounded border-input accent-primary"
        [checked]="keepSeparate()"
        (change)="keepSeparate.set($any($event.target).checked)"
      />
      {{ 'crm.customers.workflow.keepSeparate' | t }}
    </label>
    <div class="flex gap-2">
      <button
        type="submit"
        appButton
        size="sm"
        [disabled]="busy() || (state() === 'pending' && !reason().trim())"
      >
        {{ 'pipeline.confirm' | t }}
      </button>
      <button type="button" appButton size="sm" variant="outline" (click)="verifying.set(false)">
        {{ 'common.actions.cancel' | t }}
      </button>
    </div>
  </form>
}
