<div
  class="mx-auto flex w-full max-w-lg flex-col gap-6 py-4 sm:py-10 animate-rise-in [animation-duration:420ms]"
>
  <header class="flex flex-col items-center gap-3 text-center">
    <span
      class="flex size-12 items-center justify-center rounded-2xl bg-primary/10 text-primary ring-1 ring-primary/15"
      aria-hidden="true"
    >
      <app-icon [icon]="icon" svgClass="size-6" />
    </span>
    <div>
      <h1 class="text-2xl font-semibold tracking-tight text-balance">{{ 'account.mfa.title' | t }}</h1>
      <p class="mt-1.5 text-sm leading-relaxed text-muted-foreground">{{ 'account.mfa.settingHint' | t }}</p>
    </div>
  </header>

  @if (mustEnroll()) {
    <app-alert variant="info">{{ 'account.mfa.required' | t }}</app-alert>
  }

  <section appCard class="shadow-md" aria-label="{{ 'account.mfa.settingTitle' | t }}">
    <div appCardContent class="pt-6">
      <app-two-factor-setting (enabled)="enabled()" />
    </div>
  </section>
</div>
