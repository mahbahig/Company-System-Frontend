<div
  class="mx-auto flex w-full max-w-md flex-col gap-6 py-4 sm:py-10 animate-rise-in [animation-duration:420ms]"
>
  <header class="flex flex-col items-center gap-3 text-center">
    <span
      class="flex size-12 items-center justify-center rounded-2xl bg-primary/10 text-primary ring-1 ring-primary/15"
      aria-hidden="true"
    >
      <app-icon [icon]="keyIcon" svgClass="size-6" />
    </span>
    <div>
      <h1 class="text-2xl font-semibold tracking-tight text-balance">
        {{ 'account.password.title' | t }}
      </h1>
      <p class="mt-1.5 text-sm leading-relaxed text-muted-foreground">
        {{ 'account.password.subtitle' | t }}
      </p>
    </div>
  </header>

  @if (forced()) {
    <app-alert variant="info">{{ 'account.password.forced' | t }}</app-alert>
  }

  <section appCard class="shadow-md">
    <div appCardContent>
      <app-change-password-form (changed)="changed()" />
    </div>
    <div appCardFooter>
      <p
        class="flex w-full items-center justify-center gap-2 text-center text-xs text-muted-foreground"
      >
        <app-icon [icon]="shieldIcon" svgClass="size-3.5 shrink-0" />
        <span>{{ 'ux.password.signOutNote' | t }}</span>
      </p>
    </div>
  </section>
</div>
