<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <title>EcoTech CRM</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5" />
    <!-- An internal CRM must never appear in search results. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="format-detection" content="telephone=no, address=no, email=no" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <!--
      Applies the stored theme, language and direction before Angular boots,
      so there is no light→dark flash and no LTR→RTL layout jump on first paint.
      Mirrors ThemeService / I18nService (same storage keys).
    -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('ecotech.theme') || 'system';
          var dark = theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
          var locale = location.pathname.split('/')[1];
          if (locale !== 'ar' && locale !== 'en') locale = localStorage.getItem('ecotech.locale') || 'ar';
          document.documentElement.lang = locale;
          document.documentElement.dir = locale === 'ar' ? 'rtl' : 'ltr';
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="min-h-dvh bg-background text-foreground">
    <app-root></app-root>
  </body>
</html>
